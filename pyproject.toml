[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-automation-toolkit"
version = "0.1.0"
description = "A command-line toolkit for system and linux automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.0",
]

[project.scripts]
linux-toolkit = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
